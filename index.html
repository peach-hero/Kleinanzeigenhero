<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Kleinanzeigen Hero</title>

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-title" content="Kleinanzeigen Hero">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#01696f">

  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --divider: #21262d;
      --text: #f0f6fc;
      --muted: #8b949e;
      --primary: #01696f;
      --primary-hover: #02858d;
      --accent: #2ea043;
      --err: #f85149;
      --warn: #d29922;
      --success: #3fb950;
      
      --rad-sm: 6px;
      --rad-md: 10px;
      --rad-lg: 16px;
      
      --sp1: 4px;
      --sp2: 8px;
      --sp3: 12px;
      --sp4: 16px;
      --sp6: 24px;
      
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.25rem;
    }

    [data-theme="light"] {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface2: #f3f4f6;
      --border: #d0d7de;
      --divider: #e1e4e8;
      --text: #1f2328;
      --muted: #656d76;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Top Navigation Header */
    .top-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: var(--sp2) var(--sp4); display: flex; align-items: center; justify-content: space-between; height: 56px; flex-shrink: 0; }
    .brand { font-weight: 700; font-size: var(--text-lg); display: flex; align-items: center; gap: 8px; color: var(--text); }
    .brand-icon { width: 28px; height: 28px; border-radius: var(--rad-sm); object-fit: cover; }

    .header-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn { background: transparent; border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: var(--rad-sm); display: grid; place-items: center; cursor: pointer; font-size: 1.1rem; }
    .icon-btn:active { background: var(--surface2); }
    .icon-btn.active { border-color: var(--primary); background: rgba(1, 105, 111, 0.15); }

    /* Main Scroll Area */
    .scroll-container { flex: 1; overflow-y: auto; padding: var(--sp4); padding-bottom: 80px; }
    
    .page { display: none; }
    .page.active { display: block; }

    /* Cards & Components */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rad-md); overflow: hidden; margin-bottom: var(--sp4); }
    .card-head { padding: var(--sp3) var(--sp4); background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-size: var(--text-base); font-weight: 700; }
    .card-body { padding: var(--sp4); }

    /* Form Controls */
    .form-group { margin-bottom: var(--sp3); display: grid; gap: var(--sp1); }
    .form-label { font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; color: var(--muted); }
    .input, .select, .textarea { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--rad-sm); color: var(--text); font-size: var(--text-sm); outline: none; }
    .input:focus, .select:focus { border-color: var(--primary); }
    
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp2); }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--sp2); }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: var(--rad-sm); border: none; font-weight: 600; font-size: var(--text-sm); cursor: pointer; min-height: 42px; width: 100%; transition: background 0.15s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:active { background: var(--primary-hover); }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: rgba(248, 81, 73, 0.15); color: var(--err); border: 1px solid rgba(248, 81, 73, 0.3); }

    /* Chips & Badges */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chip { padding: 2px 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; font-size: var(--text-xs); color: var(--text); }
    .chip.stack { background: rgba(1, 105, 111, 0.15); border-color: var(--primary); color: #23b2b8; font-weight: 700; }
    .chip.ps { background: rgba(210, 153, 34, 0.15); border-color: var(--warn); color: var(--warn); }
    .chip.profit { background: rgba(46, 160, 67, 0.15); border-color: var(--accent); color: var(--success); font-weight: 700; }

    /* Quick Selector Chips */
    .qb-chip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--rad-sm); font-size: var(--text-xs); cursor: pointer; user-select: none; }
    .qb-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .qb-chip .qb-rm { margin-left: 4px; color: var(--muted); font-size: 14px; }
    .qb-chip .qb-rm:hover { color: var(--err); }
    .qb-add { border-style: dashed; }

    /* Items & Layout Improvements */
    .group-head { display: flex; align-items: center; justify-content: space-between; padding: var(--sp2) 0; border-bottom: 1px solid var(--divider); }
    .group-title { font-size: var(--text-base); font-weight: 700; display: flex; align-items: center; gap: 6px; }
    
    .item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rad-md); padding: var(--sp3); margin-top: var(--sp2); }
    .item-card-main { display: flex; gap: var(--sp3); align-items: flex-start; width: 100%; position: relative; }
    .thumb { width: 56px; height: 56px; border-radius: var(--rad-sm); background: var(--bg); border: 1px solid var(--border); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.5rem; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .item-info { flex: 1; min-width: 0; }
    .item-title { font-weight: 700; font-size: var(--text-base); }
    
    .item-footer { margin-top: var(--sp3); padding-top: var(--sp2); border-top: 1px solid var(--divider); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .item-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-left: auto; }

    /* Tables & Stats (Left-Aligned) */
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rad-md); padding: var(--sp3); }
    .stat-card .k { font-size: var(--text-xs); color: var(--muted); text-transform: uppercase; font-weight: 700; }
    .stat-card .v { font-size: 1.4rem; font-weight: 700; color: var(--primary); margin-top: 2px; }
    
    .mini-table { width: 100%; border-collapse: collapse; font-size: var(--text-xs); }
    .mini-table td, .mini-table th, #monthTable th, #monthTable td { padding: 8px 6px; border-bottom: 1px solid var(--divider); text-align: left !important; }
    
    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp2); }
    .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rad-md); padding: var(--sp3); }
    .kpi-card .k { font-size: var(--text-xs); color: var(--muted); }
    .kpi-card .v { font-size: var(--text-base); font-weight: 700; margin: 2px 0; }
    .kpi-card .d { font-size: 10px; color: var(--muted); }

    /* Sold / History Card */
    .sold-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rad-md); padding: var(--sp3); margin-bottom: var(--sp3); }
    .sold-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .sold-thumb { width: 56px; height: 56px; border-radius: var(--rad-sm); background: var(--bg); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.5rem; }
    .sold-thumb img { width: 100%; height: 100%; object-fit: cover; }

    /* Modals & Popups */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; padding: var(--sp4); }
    .modal.show { display: flex; }
    .modal-content { background: var(--surface); border: 1px solid var(--border); border-radius: var(--rad-lg); width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: var(--sp4); }
    
    .img-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

    /* Bottom Navigation Bar (Ohne Historie & Statistik) */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; height: 60px; z-index: 100; }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: transparent; border: none; color: var(--muted); font-size: 11px; cursor: pointer; }
    .nav-btn .icon { font-size: 1.2rem; }
    .nav-btn.active { color: var(--primary); font-weight: 700; }

    /* Toast Notification */
    #toast { position: fixed; bottom: 75px; left: 50%; transform: translateX(-50%) translateY(20px); background: #323232; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: var(--text-xs); opacity: 0; transition: all 0.2s; pointer-events: none; z-index: 2000; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .empty { text-align: center; color: var(--muted); padding: var(--sp6) var(--sp4); font-size: var(--text-sm); }
  </style>
</head>
<body>

  <!-- Top Header Bar mit Historie & Statistik Buttons -->
  <header class="top-bar">
    <div class="brand">
      <img src="icon-192.png" class="brand-icon" alt="Logo" onerror="this.style.display='none'">
      <span>Kleinanzeigen Hero</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" data-page="sold" title="Historie">📜</button>
      <button class="icon-btn" data-page="stats" title="Statistik">📊</button>
      <button class="icon-btn" id="themeToggle" title="Theme wechseln">🌗</button>
      <button class="icon-btn" data-page="master" title="Stammdaten">⚙️</button>
    </div>
  </header>

  <!-- Scrollable Page Container -->
  <main class="scroll-container">

    <!-- PAGE: Neu anlegen -->
    <section id="page-new" class="page active">
      <div class="card">
        <div class="card-head"><h3 class="card-title">✚ Neuer Artikel</h3></div>
        <div class="card-body">
          <form id="itemForm">
            <div class="form-group">
              <label class="form-label">Gruppe</label>
              <select id="group" class="select" style="display:none;" onchange="onGroupChange()"></select>
              <div id="qb-group" class="chips"></div>
            </div>

            <div class="form-group" id="field-productType" style="display:none;">
              <label class="form-label">Produkttyp</label>
              <select id="productType" class="select" style="display:none;" onchange="onProductTypeChange()"></select>
              <div id="qb-productType" class="chips"></div>
            </div>

            <div class="form-group" id="field-article" style="display:none;">
              <label class="form-label">Artikelname</label>
              <select id="article" class="select" style="display:none;"></select>
              <div id="qb-article" class="chips"></div>
            </div>

            <div class="grid2" id="field-size-color" style="display:none;">
              <div class="form-group">
                <label class="form-label">Größe</label>
                <select id="size" class="select" style="display:none;"></select>
                <div id="qb-size" class="chips"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Farbe</label>
                <select id="color" class="select" style="display:none;"></select>
                <div id="qb-color" class="chips"></div>
              </div>
            </div>

            <div class="grid2">
              <div class="form-group">
                <label class="form-label">Einkaufspreis (€)</label>
                <input type="number" step="0.01" id="purchasePrice" class="input" placeholder="0.00">
              </div>
              <div class="form-group">
                <label class="form-label">Anzahl</label>
                <input type="number" id="quantity" class="input" value="1" min="1">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Bild auswählen</label>
              <button type="button" class="btn btn-ghost" onclick="openNewImgPicker()" style="justify-content:flex-start;">
                <span id="imgPreview">📷</span> <span id="imgLabel">Wählen…</span>
              </button>
              <input type="hidden" id="imgValue">
            </div>

            <div class="form-group">
              <label class="form-label">Bemerkung / Mangel</label>
              <input type="text" id="defect" class="input" placeholder="z.B. Kratzer oben links">
            </div>

            <div class="form-group" style="margin-top:8px;">
              <label style="display:flex; align-items:center; gap:8px; font-size:var(--text-sm); cursor:pointer;">
                <input type="checkbox" id="profitshare" style="width:18px;height:18px;">
                Profitshare (Gewinnteilung)
              </label>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top:var(--sp2);">Hinzufügen</button>
          </form>
        </div>
      </div>
    </section>

    <!-- PAGE: Offener Bestand -->
    <section id="page-open" class="page">
      <div style="display:flex; gap:8px; margin-bottom:var(--sp3);">
        <input type="text" id="openSearchText" class="input" placeholder="🔍 Suche im Bestand..." oninput="updateOpenFilters()">
        <button id="toggleAllBtn" class="btn btn-ghost" style="width:auto; white-space:nowrap;" onclick="toggleAllGroups()">↕ Alle</button>
      </div>

      <div class="grid3" style="margin-bottom:var(--sp3);">
        <select id="openSearchGroup" class="select" onchange="updateOpenFilters()"><option value="">Grps</option></select>
        <select id="openSearchType" class="select" onchange="updateOpenFilters()"><option value="">Typen</option></select>
        <select id="openSearchArticle" class="select" onchange="updateOpenFilters()"><option value="">Art</option></select>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--sp3);">
        <span style="font-size:var(--text-xs); color:var(--muted);">Nullbestände ausblenden</span>
        <div id="zeroFilterBtn" onclick="toggleZeroFilter()" style="width:40px; height:20px; background:#ccc; border-radius:10px; position:relative; cursor:pointer; transition:background 0.2s;">
          <div id="zeroFilterKnob" style="width:16px; height:16px; background:#fff; border-radius:50%; position:absolute; top:2px; left:2px; transition:left 0.2s;"></div>
        </div>
      </div>

      <div id="openContent"></div>
    </section>

    <!-- PAGE: Verkaufen -->
    <section id="page-sell" class="page">
      <div class="card">
        <div class="card-head"><h3 class="card-title">🛍 Verkauf erfassen</h3></div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">1. Filter wählen</label>
            <div class="grid2">
              <select id="sellFilterGroup" class="select" onchange="updateSellFilters('group')"></select>
              <select id="sellFilterType" class="select" onchange="updateSellFilters('type')"></select>
            </div>
            <div class="grid3" style="margin-top:6px;">
              <select id="sellFilterArticle" class="select" onchange="updateSellFilters('article')"></select>
              <select id="sellFilterSize" class="select" onchange="updateSellFilters('size')"></select>
              <select id="sellFilterColor" class="select" onchange="updateSellFilters('color')"></select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">2. Exemplar hinzufügen</label>
            <div style="display:flex; gap:8px;">
              <select id="sellFilterInstance" class="select"></select>
              <button type="button" class="btn btn-primary" style="width:auto;" onclick="addSellPosition()">✚</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Warenkorb</label>
            <div id="sellCartContainer"></div>
          </div>

          <hr style="border:none; border-top:1px solid var(--border); margin:var(--sp4) 0;">

          <div class="form-group">
            <label class="form-label">Set Name / Basisname</label>
            <input type="text" id="sellBaseName" class="input" placeholder="z.B. Besta TV-Kombination" oninput="updateSellPreview()">
            <div id="sellNamePreview" style="font-size:var(--text-xs); color:var(--muted); margin-top:2px;"></div>
          </div>

          <div class="grid2">
            <div class="form-group">
              <label class="form-label">Verkaufspreis (€)</label>
              <input type="number" step="0.01" id="sellPrice" class="input" placeholder="0.00" oninput="updateSellPreview()">
            </div>
            <div class="form-group">
              <label class="form-label">Profitshare %</label>
              <input type="number" id="sellPsInput" class="input" value="0" min="0" max="100" oninput="state.psManualOverride=true; updateSellPreview()">
            </div>
          </div>

          <div style="background:var(--surface2); padding:var(--sp3); border-radius:var(--rad-md); margin-bottom:var(--sp3); font-size:var(--text-xs);">
            <div>EK Gesamt: <b id="sellEKTotal">0,00 €</b></div>
            <div>Rohertrag: <b id="sellNetto">0,00 €</b></div>
            <div id="sellFinalProfit" style="font-weight:700; color:var(--primary); margin-top:4px;"></div>
          </div>

          <button type="button" class="btn btn-primary" onclick="executeSale()">Verkauf abschließen</button>
        </div>
      </div>
    </section>

    <!-- PAGE: Verkauft Historie -->
    <section id="page-sold" class="page">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--sp3);">
        <input type="text" id="soldSearch" class="input" placeholder="🔍 Verkaufte Durchsuchen..." oninput="renderSold()">
      </div>
      <div id="soldSubtitle" style="font-size:var(--text-xs); color:var(--muted); margin-bottom:var(--sp3);"></div>
      <div id="soldContent"></div>
    </section>

    <!-- PAGE: Termine (1-Spalten-Layout mit Kalender-Picker & Maps) -->
    <section id="page-termin" class="page">
      <div class="card">
        <div class="card-head"><h3 class="card-title">📅 Neuer Termin</h3></div>
        <div class="card-body">
          <form id="terminForm">
            <div class="grid2">
              <div class="form-group">
                <label class="form-label">Art</label>
                <select id="terminArt" class="select">
                  <option value="Abholung">Abholung (Verkauf)</option>
                  <option value="Übergabe">Einkauf / Übergabe</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Name / Artikel</label>
                <input type="text" id="terminName" class="input" placeholder="z.B. Besta Korpus" required>
              </div>
            </div>

            <div class="grid2">
              <div class="form-group">
                <label class="form-label">Datum (Kalender)</label>
                <input type="date" id="terminDatum" class="input" required>
              </div>
              <div class="form-group">
                <label class="form-label">Uhrzeit</label>
                <select id="terminUhrzeit" class="select" required></select>
              </div>
            </div>

            <div class="grid2">
              <div class="form-group">
                <label class="form-label">Preis / Betrag</label>
                <input type="text" id="terminPreis" class="input" placeholder="z.B. 50 €">
              </div>
              <div class="form-group">
                <label class="form-label">Ort / Adresse (für Google Maps)</label>
                <input type="text" id="terminOrt" class="input" placeholder="Strasse 12, Stadt">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Kleinanzeigen-User</label>
              <input type="text" id="terminUser" class="input" placeholder="Username">
            </div>

            <div class="form-group">
              <label class="form-label">Info</label>
              <input type="text" id="terminInfo" class="input" placeholder="Notizen...">
            </div>

            <button type="submit" class="btn btn-primary">Termin eintragen</button>
          </form>
        </div>
      </div>

      <div id="terminContent"></div>
    </section>

    <!-- PAGE: Statistiken mit dynamischem KPI-Filter -->
    <section id="page-stats" class="page">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--sp3);">
        <h2>Statistik</h2>
        <select id="statsYear" class="select" style="width:auto;"></select>
      </div>

      <!-- KPI Filter für Dynamische Auswertung -->
      <div class="card" style="margin-bottom:var(--sp3);">
        <div class="card-head"><h3 class="card-title">🔍 Interaktiver KPI Filter</h3></div>
        <div class="card-body">
          <div class="grid3">
            <select id="statsFilterGrp" class="select" onchange="renderStats()"><option value="">Alle Gruppen</option></select>
            <select id="statsFilterTyp" class="select" onchange="renderStats()"><option value="">Alle Typen</option></select>
            <select id="statsFilterArt" class="select" onchange="renderStats()"><option value="">Alle Artikel</option></select>
          </div>
        </div>
      </div>

      <div id="statsCards" class="grid2" style="margin-bottom:var(--sp3);"></div>
      
      <div class="card" style="margin-bottom:var(--sp3);">
        <div class="card-head"><h3 class="card-title">Monatsübersicht</h3></div>
        <div class="card-body" style="padding:0; overflow-x:auto;">
          <table id="monthTable" class="mini-table" style="margin:0;"></table>
        </div>
      </div>

      <div id="top5Cards"></div>
      <div id="kpiCards" style="margin-bottom:var(--sp3);"></div>
    </section>

    <!-- PAGE: Stammdaten (Master) -->
    <section id="page-master" class="page">
      <div class="card">
        <div class="card-head"><h3 class="card-title">✚ Stammdaten hinzufügen</h3></div>
        <div class="card-body">
          <form id="masterForm">
            <div class="form-group">
              <label class="form-label">Kategorie</label>
              <select id="masterType" class="select" onchange="updateMasterForm()">
                <option value="groups">Gruppe (z.B. Besta)</option>
                <option value="producttypes">Produkttyp (z.B. Tür)</option>
                <option value="articles">Artikelname (z.B. Selsviken)</option>
                <option value="sizes">Größe (z.B. 64x64)</option>
                <option value="colors">Farbe (z.B. Weiß)</option>
              </select>
            </div>

            <div class="form-group mf-grp" style="display:none;">
              <label class="form-label">Gruppe wählen</label>
              <select id="masterGroup" class="select" onchange="updateMasterForm()"></select>
            </div>

            <div class="form-group mf-typ" style="display:none;">
              <label class="form-label">Produkttyp wählen</label>
              <select id="masterProdType" class="select"></select>
            </div>

            <div class="form-group mf-val">
              <label class="form-label" id="masterValueLabel">Wert</label>
              <input type="text" id="masterValue" class="input">
            </div>

            <button type="submit" class="btn btn-primary">Speichern</button>
          </form>
        </div>
      </div>

      <!-- Cloud Sync & Backup Card -->
      <div class="card">
        <div class="card-head"><h3 class="card-title">☁️ Cloud Sync & Backup</h3></div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">Google Apps Script WebApp URL</label>
            <input type="text" id="gasUrl" class="input" placeholder="https://script.google.com/macros/s/.../exec">
          </div>
          <div class="grid2" style="margin-bottom:var(--sp3);">
            <button class="btn btn-primary" onclick="saveToCloud()">☁️ In Cloud</button>
            <button class="btn btn-ghost" onclick="loadFromCloud()">⬇️ Aus Cloud</button>
          </div>
          <div class="grid2">
            <button id="exportBtn" class="btn btn-ghost">💾 JSON Export</button>
            <label class="btn btn-ghost" style="cursor:pointer; text-align:center;">
              📂 Import
              <input type="file" style="display:none;" onchange="importData(this.files[0])">
            </label>
          </div>
        </div>
      </div>

      <div id="masterContent"></div>
    </section>

  </main>

  <!-- Bottom Navigation Bar (Aufgeräumt ohne Historie & Statistik) -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-page="new">
      <span class="icon">✚</span>
      <span>Neu</span>
    </button>
    <button class="nav-btn" data-page="open">
      <span class="icon">📦</span>
      <span>Bestand</span>
    </button>
    <button class="nav-btn" data-page="sell">
      <span class="icon">🏷️</span>
      <span>Verkauf</span>
    </button>
    <button class="nav-btn" data-page="termin">
      <span class="icon">📅</span>
      <span>Termine</span>
    </button>
  </nav>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <!-- Image Picker Modal -->
  <div id="imagePickerModal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:var(--sp3);">
        <h3>Bild auswählen</h3>
        <button class="btn btn-ghost" style="width:auto; padding:4px 8px;" onclick="closeImagePicker()">✕</button>
      </div>
      <div id="imagePickerList" class="img-grid"></div>
    </div>
  </div>

  <!-- Main JavaScript File -->
  <script src="./app.js"></script>

</body>
</html>
